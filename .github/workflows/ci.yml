name: CI

# La rama del repo es master, no main: con [main] esto no corría en
# ningún push y solo se habría disparado en un pull request.
on:
  push:
    branches: [master]
  pull_request:
  # Botón "Run workflow" en la pestaña Actions, para poder dispararlo a
  # mano sin tener que inventar un commit.
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # El script corre `next typegen` antes de tsc: los tipos globales
      # que usa app/layout.tsx (LayoutProps) los genera Next dentro de
      # .next/, que en un clon limpio no existe. Sin eso, tsc falla acá
      # con "Cannot find name 'LayoutProps'" aunque localmente ande.
      - run: npm run typecheck

      # test:unit y no test: los *.rls.test.ts se conectan al Supabase
      # hosteado con las claves de .env.local, que no existen acá.
      - run: npm run test:unit
