name: CI

# La rama del repo es master, no main: con [main] esto no corría en
# ningún push y solo se habría disparado en un pull request.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # test:unit y no test: los *.rls.test.ts se conectan al Supabase
      # hosteado con las claves de .env.local, que no existen acá.
      - run: npm run test:unit
